/* ==========================================================================
   Spider-Verse Interactive Scroll Landing & Greeting Companion
   ========================================================================== */
#portfolio-work {
  position: relative;
  width: 100%;
  z-index: 9999999 !important;
}

.spidey-companion-stage {
  position: fixed;
  bottom: 25px;
  right: 3vw;
  width: 320px;
  height: 520px;
  z-index: 9999999 !important;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  opacity: 0;
  transform: translateY(-80px) scale(0.9);
  transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}

.spidey-companion-stage.is-active {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.spidey-companion-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

/* Character frame */
.spidey-character-frame {
  position: relative;
  width: 280px;
  max-width: 90%;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  z-index: 2;
  filter: drop-shadow(0 15px 25px rgba(19, 36, 65, 0.25));
  transform-origin: bottom center;
}

.spidey-character-frame img {
  width: 100%;
  height: auto;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
}

/* Crouch Impact Strike */
.spidey-companion-stage.landing .spidey-character-frame {
  animation: spidey-impact-strike 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

@keyframes spidey-impact-strike {
  0% { transform: translateY(-160px) scale(0.85); }
  60% { transform: translateY(8px) scale(1.04, 0.96); }
  85% { transform: translateY(-4px) scale(0.98, 1.02); }
  100% { transform: translateY(0) scale(1); }
}

/* Stand & Wave */
.spidey-companion-stage.standing .spidey-character-frame {
  animation: spidey-wave-sway 2.4s ease-in-out infinite alternate;
}

@keyframes spidey-wave-sway {
  0% { transform: rotate(0deg) translateY(0); }
  50% { transform: rotate(1.5deg) translateY(-3px); }
  100% { transform: rotate(-1deg) translateY(0); }
}

/* Comic Impact Explosion ("THUD!") */
.comic-fx-bang {
  position: absolute;
  top: 35%;
  right: 15px;
  z-index: 5;
  opacity: 0;
  transform: scale(0) rotate(-20deg);
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.comic-fx-bang.show {
  opacity: 1;
  animation: bang-pop 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.3) forwards;
}

.bang-star {
  background: #ef2437;
  color: #ffffff;
  padding: 8px 18px;
  font-family: Impact, "Arial Black", sans-serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 2px;
  border: 4px solid #132441;
  box-shadow: 4px 4px 0px #132441;
  clip-path: polygon(0% 15%, 15% 0%, 35% 10%, 50% 0%, 70% 12%, 85% 0%, 100% 15%, 90% 40%, 100% 65%, 85% 85%, 65% 75%, 50% 100%, 35% 80%, 15% 95%, 0% 75%, 10% 45%);
  text-shadow: 2px 2px 0px #132441;
}

@keyframes bang-pop {
  0% { transform: scale(0.2) rotate(-30deg); opacity: 0; }
  50% { transform: scale(1.25) rotate(-10deg); opacity: 1; }
  80% { transform: scale(1.1) rotate(-8deg); opacity: 1; }
  100% { transform: scale(0.9) rotate(-5deg); opacity: 0; }
}

/* Ground burst lines */
.comic-ground-burst {
  position: absolute;
  bottom: 5px;
  width: 220px;
  height: 50px;
  z-index: 1;
  opacity: 0;
  transform: scale(0.5);
  pointer-events: none;
}

.comic-ground-burst.show {
  animation: burst-flash 0.5s ease-out forwards;
}

@keyframes burst-flash {
  0% { opacity: 0; transform: scale(0.5); }
  40% { opacity: 1; transform: scale(1.1); }
  100% { opacity: 0; transform: scale(1.3); }
}

/* Comic Speech Bubble */
.spidey-speech-bubble {
  position: absolute;
  bottom: 85%;
  left: -40px;
  width: 280px;
  background: #ffffff;
  border: 3.5px solid #132441;
  border-radius: 18px 18px 18px 4px;
  box-shadow: 6px 6px 0px #132441;
  padding: 14px 16px;
  z-index: 10;
  opacity: 0;
  transform: translateY(20px) scale(0.85);
  transform-origin: bottom right;
  pointer-events: auto;
  cursor: pointer;
  transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.spidey-speech-bubble.show {
  opacity: 1;
  transform: translateY(0) scale(1);
}

.spidey-speech-bubble:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 8px 8px 0px #132441;
}

.spidey-speech-bubble:active {
  transform: translateY(1px) scale(0.98);
  box-shadow: 3px 3px 0px #132441;
}

/* Pointer tail */
.spidey-speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -16px;
  right: 50px;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 16px solid #132441;
}

.spidey-speech-bubble::before {
  content: '';
  position: absolute;
  bottom: -11px;
  right: 52px;
  width: 0;
  height: 0;
  border-left: 10px solid transparent;
  border-right: 10px solid transparent;
  border-top: 13px solid #ffffff;
  z-index: 1;
}

.bubble-header {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.bubble-icon {
  font-size: 18px;
  display: inline-block;
  animation: hand-wave 1.5s infinite;
  transform-origin: 70% 70%;
}

@keyframes hand-wave {
  0% { transform: rotate(0deg); }
  20% { transform: rotate(14deg); }
  40% { transform: rotate(-8deg); }
  60% { transform: rotate(14deg); }
  80% { transform: rotate(-4deg); }
  100% { transform: rotate(0deg); }
}

.bubble-tag {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: #132441;
  color: #faf6ec;
  padding: 2px 7px;
  border-radius: 4px;
}

.bubble-body strong {
  display: block;
  font-size: 14.5px;
  color: #132441;
  margin-bottom: 3px;
  font-weight: 800;
}

.bubble-body p {
  margin: 0;
  font-size: 12px;
  line-height: 1.35;
  color: #435368;
}

.bubble-footer {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1.5px dashed #cbd5e1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  font-weight: 700;
  color: #059669;
}

.bubble-live-dot {
  width: 7px;
  height: 7px;
  background: #10b981;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
  animation: pulse-dot 1.8s infinite;
}

@keyframes pulse-dot {
  0% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0.5); }
  70% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0px rgba(16, 185, 129, 0); }

.bubble-tap-hint {
  color: #ef2437;
  font-size: 9.5px;
}

  }
}
